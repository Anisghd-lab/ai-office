name: AI Office Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Native Android APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate Checksums & Release Manifest
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/ai-office-v1.0.0.apk
          cd release-artifacts
          sha256sum ai-office-v1.0.0.apk > checksums.txt
          md5sum ai-office-v1.0.0.apk >> checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          gh release upload "$TAG_NAME" release-artifacts/ai-office-v1.0.0.apk release-artifacts/checksums.txt --clobber || \
          gh release create "$TAG_NAME" release-artifacts/ai-office-v1.0.0.apk release-artifacts/checksums.txt \
            --title "AI Office ${TAG_NAME} — Android Control Center & Multi-Agent Backend" \
            --notes-file reports/FINAL_RELEASE_REPORT.md
